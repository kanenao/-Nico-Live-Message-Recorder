name: Release Nico Live Message Recorder

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Nico Live Message Recorder
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nicolive-recorder-release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check whether this version is already published
        id: release-check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read package.json version."
          }
          $tag = "v$version"
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          try {
            $null = Invoke-RestMethod -Uri $releaseUrl -Headers $headers -Method Get
            "already_published=true" >> $env:GITHUB_OUTPUT
            Write-Host "$tag is already published; skip duplicate release."
          } catch {
            $statusCode = 0
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -eq 404) {
              "already_published=false" >> $env:GITHUB_OUTPUT
              Write-Host "$tag is not published; create beta release."
            } else {
              throw "Unable to check GitHub Release for $tag (HTTP $statusCode): $($_.Exception.Message)"
            }
          }
      - name: Verify release tag matches package version
        if: github.ref_type == 'tag' && steps.release-check.outputs.already_published != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag $env:RELEASE_TAG does not match package version $expected"
          }
      - name: Run application tests
        if: steps.release-check.outputs.already_published != 'true'
        run: npm test
      - name: Build and publish Windows release to GitHub Releases
        if: steps.release-check.outputs.already_published != 'true'
        run: npm run dist:win:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify beta update metadata
        if: steps.release-check.outputs.already_published != 'true'
        shell: pwsh
        run: |
          $metadata = Join-Path "dist" "beta.yml"
          if (-not (Test-Path $metadata)) {
            throw "dist/beta.yml was not generated. The beta auto-update feed cannot work."
          }
