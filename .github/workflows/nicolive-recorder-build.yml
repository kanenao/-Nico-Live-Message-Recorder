name: Build Nico Live Message Recorder

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "electron/**"
      - "index.html"
      - "renderer.js"
      - "composition.js"
      - "styles.css"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "tests/**"
      - "scripts/**"
      - "build/**"
      - ".github/workflows/nicolive-recorder-build.yml"
      - ".github/workflows/nicolive-recorder-release.yml"
  pull_request:
    paths:
      - "electron/**"
      - "index.html"
      - "renderer.js"
      - "composition.js"
      - "styles.css"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "tests/**"
      - ".github/workflows/nicolive-recorder-build.yml"
  workflow_dispatch:

concurrency:
  group: nicolive-recorder-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run application tests
        run: npm test
      - name: Build installer and portable ZIP
        run: npm run dist:win
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Nico-Live-Message-Recorder-beta31-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
