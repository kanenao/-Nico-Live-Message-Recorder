name: Build Nico Live Message Recorder

on:
  push:
    branches:
      - main
      - beta
      - "feature/**"
    paths:
      - "electron/**"
      - "index.html"
      - "renderer.js"
      - "composition.js"
      - "styles.css"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "tests/**"
      - "scripts/**"
      - "build/**"
      - ".github/workflows/nicolive-recorder-build.yml"
      - ".github/workflows/nicolive-recorder-release.yml"
  pull_request:
    paths:
      - "electron/**"
      - "index.html"
      - "renderer.js"
      - "composition.js"
      - "styles.css"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "tests/**"
      - ".github/workflows/nicolive-recorder-build.yml"
  workflow_dispatch:

concurrency:
  group: nicolive-recorder-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize README version and release history
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        shell: pwsh
        run: |
          npm run docs:update
          if ($LASTEXITCODE -ne 0) { throw "README synchronization failed." }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: sync README version and release history [skip ci]"
            git push
          }
      - name: Mirror beta README and changelog to repository home page
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        shell: pwsh
        run: |
          git fetch origin main
          $mainDir = Join-Path $env:RUNNER_TEMP "main-docs"
          if (Test-Path $mainDir) { Remove-Item $mainDir -Recurse -Force }
          git worktree add --detach $mainDir origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare main branch worktree." }
          Copy-Item README.md (Join-Path $mainDir "README.md") -Force
          Copy-Item CHANGELOG.md (Join-Path $mainDir "CHANGELOG.md") -Force
          git -C $mainDir config user.name "github-actions[bot]"
          git -C $mainDir config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C $mainDir add README.md CHANGELOG.md
          git -C $mainDir diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git -C $mainDir commit -m "docs: mirror latest beta README and changelog [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit mirrored beta documentation." }
            git -C $mainDir push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Could not push mirrored documentation to main." }
          }
          git worktree remove --force $mainDir
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run application tests
        run: npm test
      - name: Build installer and portable ZIP
        run: npm run dist:win
      - name: Read app version
        id: app-version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Nico-Live-Message-Recorder-${{ steps.app-version.outputs.version }}-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
